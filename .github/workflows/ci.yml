name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: |
          python -m pip install pytest==8.0.0 pillow==12.3.0 requests==2.34.2
          python -m pytest tests -v

  # The image has no baked-in weights, so it fits on a hosted runner. Its last
  # build step starts ComfyUI and has it validate both workflows.
  image-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Build image (runs selftest)
        run: docker build -t worker-wan:ci .
